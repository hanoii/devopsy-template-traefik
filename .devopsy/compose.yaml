services:
  # Read-only, filtered access to the Docker API for Traefik, so Traefik never
  # mounts the Docker socket itself.
  # https://github.com/wollomatic/socket-proxy
  # Pinned exactly: it publishes no minor tag, and its allow-list flags are
  # security settings, so a bump is read in its release notes first.
  dockerproxy:
    restart: unless-stopped
    image: wollomatic/socket-proxy:1.13.1
    command:
      - '-loglevel=info' # debug for far more logging
      - '-listenip=0.0.0.0'
      # Only the traefik container may connect.
      - '-allowfrom=traefik'
      # Only the read-only endpoints Traefik's Docker provider calls: version,
      # list, inspect, events. Not containers/.*, which also lets through
      # export, archive, logs and attach of every container.
      - '-allowGET=/v1\..{1,2}/(version|containers/json|containers/[a-zA-Z0-9_.-]+/json|events)'
      - '-allowHEAD=/_ping'
      - '-shutdowngracetime=5'
      # Exit if the socket goes away (Docker upgrade, for example) so the
      # restart policy brings it back with a fresh connection.
      - '-watchdoginterval=3600'
      - '-stoponwatchdog'
      - '-allowhealthcheck'
    healthcheck:
      test: ['CMD', './healthcheck']
      interval: 10s
      timeout: 5s
      retries: 2
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    # nobody, in the group that owns the Docker socket on the host
    # (`stat -c %g /var/run/docker.sock`). On macOS with OrbStack the socket
    # is always mounted as root, so the default of 0 works there.
    user: 65534:${PROXY_DOCKER_GID-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dockerproxy

  # Floats on v3.7: every release pulls its patches. Minors (v3.8) bring
  # migration notes and a new Yaegi for the plugins: bump them by hand.
  traefik:
    restart: unless-stopped
    image: traefik:v3.7
    # For devopsy (see its README, "Roles, exports and imports"): this is the
    # host's proxy, and projects importing proxy/BASE_DOMAIN get the
    # server's base domain (empty: none) in each release.
    labels:
      - devopsy.role=proxy
      - devopsy.export.BASE_DOMAIN=${PROXY_BASE_DOMAIN:-}
      # devopsy creates mnt/letsencrypt and gives it, and everything in it,
      # to this UID before the run step: shared/mnt starts empty and
      # belongs to the deploy user, which cannot chown. Keep it in step
      # with user. Traefik creates its ACME files with mode 600, which it
      # insists on (see AGENTS.md).
      - devopsy.mnt.owner=10001:10001
    depends_on:
      dockerproxy:
        condition: service_healthy
    environment:
      # Dashboard and API on port 8080, published on localhost only (see
      # ports). Reach it with an SSH tunnel. Not insecure: its router
      # (mnt/dynamic/devopsy-api.yaml, from `deploy`) only lets Traefik
      # and the host in, since the entrypoint listens on every network
      # Traefik joins, projects' included.
      - TRAEFIK_API=true
      - TRAEFIK_API_DASHBOARD=true
      - TRAEFIK_PING=true
      - TRAEFIK_ENTRYPOINTS_TRAEFIK_ADDRESS=:8080
      - TRAEFIK_ENTRYPOINTS_TRAEFIK_HTTP_ALIASHEADERSSTRATEGY=delete
      - TRAEFIK_LOG_LEVEL=${TRAEFIK_LOG_LEVEL-ERROR}

      # HTTP redirects everything to HTTPS.
      - TRAEFIK_ENTRYPOINTS_WEB=true
      - TRAEFIK_ENTRYPOINTS_WEB_ADDRESS=:80
      - TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_TO=websecure
      - TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_SCHEME=https
      - TRAEFIK_ENTRYPOINTS_WEB_HTTP_ALIASHEADERSSTRATEGY=delete
      - TRAEFIK_ENTRYPOINTS_WEBSECURE=true
      - TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS=:443
      - TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS=true
      # How long a request may take to arrive, body included. Traefik's 60s
      # default cuts large uploads, like image layers pushed to a registry;
      # 0 disables it.
      - TRAEFIK_ENTRYPOINTS_WEBSECURE_TRANSPORT_RESPONDINGTIMEOUTS_READTIMEOUT=${PROXY_READ_TIMEOUT-60s}
      # Default resolver for every router: le-http01 (HTTP-01),
      # le-dns01-selfhosted or le-dns01-cloudflare (DNS-01), empty or unset
      # le-http01. A router can pick another with its own label.
      - TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS_CERTRESOLVER=${PROXY_CERTRESOLVER:-le-http01}
      # On every entrypoint, drop headers that alias others for PHP and
      # similar backends (X_Forwarded_For vs X-Forwarded-For), so clients
      # cannot spoof the headers Traefik sets.
      - TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_ALIASHEADERSSTRATEGY=delete

      # Visitors through a Cloudflare Tunnel (devopsy-template-cloudflared):
      # plain HTTP from its connectors on the tunnel network, at
      # http://traefik.tunnel:8081. Never published. TLS ends at Cloudflare's
      # edge, so routers here get no certificate. Its trust (forwarded
      # headers and the visitor's IP from CF-Connecting-IP, from the tunnel
      # network's subnet only) and which entrypoints routers take by default
      # (PROXY_TUNNEL_ONLY) are in mnt/traefik.env (static_env).
      - TRAEFIK_ENTRYPOINTS_TUNNEL=true
      - TRAEFIK_ENTRYPOINTS_TUNNEL_ADDRESS=:8081
      - TRAEFIK_ENTRYPOINTS_TUNNEL_HTTP_ALIASHEADERSSTRATEGY=delete
      - TRAEFIK_ENTRYPOINTS_TUNNEL_TRANSPORT_RESPONDINGTIMEOUTS_READTIMEOUT=${PROXY_READ_TIMEOUT-60s}

      # Containers opt in with traefik.enable=true and must join this network.
      - TRAEFIK_PROVIDERS_DOCKER=true
      - TRAEFIK_PROVIDERS_DOCKER_ENDPOINT=tcp://dockerproxy:2375
      - TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT=false
      - TRAEFIK_PROVIDERS_DOCKER_NETWORK=traefik
      # A plugin that fails to load stops Traefik instead of being skipped:
      # the entrypoint's middleware list names proxies, and a running
      # Traefik without it fails every router while looking healthy.
      # Stopped, `up --wait` fails and the release rolls back.
      - TRAEFIK_EXPERIMENTAL_ABORTONPLUGINFAILURE=true

      # Extra dynamic configuration, like the public wildcard certificate:
      # files deploy and the commands write in mnt/dynamic.
      - TRAEFIK_PROVIDERS_FILE_DIRECTORY=/dynamic
      - TRAEFIK_PROVIDERS_FILE_WATCH=true

      # Let's Encrypt with the HTTP-01 challenge on port 80. It works with or
      # without a CDN proxy in front, and Traefik answers the challenge path
      # before the HTTPS redirect. Staging by default; set the CA server to
      # https://acme-v02.api.letsencrypt.org/directory for real certificates.
      # https://doc.traefik.io/traefik/https/acme/#httpchallenge
      - TRAEFIK_CERTIFICATESRESOLVERS_LE-HTTP01=true
      - TRAEFIK_CERTIFICATESRESOLVERS_LE-HTTP01_ACME_EMAIL=${PROXY_LE_ACME_EMAIL:?A valid email is required for Let's Encrypt}
      - TRAEFIK_CERTIFICATESRESOLVERS_LE-HTTP01_ACME_CASERVER=${PROXY_LE_ACME_CASERVER-https://acme-staging-v02.api.letsencrypt.org/directory}
      - TRAEFIK_CERTIFICATESRESOLVERS_LE-HTTP01_ACME_STORAGE=/letsencrypt/acme-le-http01.json
      - TRAEFIK_CERTIFICATESRESOLVERS_LE-HTTP01_ACME_HTTPCHALLENGE_ENTRYPOINT=web

      # DNS-01 through the optional acme-dns server below. Always defined; it
      # only works once the acmedns profile runs. Same account and CA as
      # le-http01. acme-dns answers updates at once, so no propagation
      # checks (they would also query this host through its public IP).
      - TRAEFIK_CERTIFICATESRESOLVERS_LE-DNS01-SELFHOSTED=true
      - TRAEFIK_CERTIFICATESRESOLVERS_LE-DNS01-SELFHOSTED_ACME_EMAIL=${PROXY_LE_ACME_EMAIL}
      - TRAEFIK_CERTIFICATESRESOLVERS_LE-DNS01-SELFHOSTED_ACME_CASERVER=${PROXY_LE_ACME_CASERVER-https://acme-staging-v02.api.letsencrypt.org/directory}
      - TRAEFIK_CERTIFICATESRESOLVERS_LE-DNS01-SELFHOSTED_ACME_STORAGE=/letsencrypt/acme-le-dns01-selfhosted.json
      - TRAEFIK_CERTIFICATESRESOLVERS_LE-DNS01-SELFHOSTED_ACME_DNSCHALLENGE_PROVIDER=acmedns
      - TRAEFIK_CERTIFICATESRESOLVERS_LE-DNS01-SELFHOSTED_ACME_DNSCHALLENGE_PROPAGATION_DISABLECHECKS=true
      - ACME_DNS_API_BASE=http://acmedns
      # Per-domain acme-dns accounts. `devopsy acmedns` reads it to list the
      # CNAME records to create.
      - ACME_DNS_STORAGE_PATH=/letsencrypt/acme-dns-accounts.json

      # DNS-01 through Cloudflare's API. Always defined; it only works with
      # PROXY_CLOUDFLARE_DNS_API_TOKEN in .env (see README.md). Same account
      # and CA as le-http01. Propagation is checked against the host's
      # resolvers (Docker's embedded DNS, 127.0.0.11), then public ones: lego
      # asks the next one when a resolver fails or has no answer yet. Then
      # against the zone's authoritative nameservers, on port 53. Where
      # outbound DNS is blocked, skip the checks and wait instead (see
      # .env.example): the host's resolver caches that the record does not
      # exist, from the lookup made before writing it.
      - TRAEFIK_CERTIFICATESRESOLVERS_LE-DNS01-CLOUDFLARE=true
      - TRAEFIK_CERTIFICATESRESOLVERS_LE-DNS01-CLOUDFLARE_ACME_EMAIL=${PROXY_LE_ACME_EMAIL}
      - TRAEFIK_CERTIFICATESRESOLVERS_LE-DNS01-CLOUDFLARE_ACME_CASERVER=${PROXY_LE_ACME_CASERVER-https://acme-staging-v02.api.letsencrypt.org/directory}
      - TRAEFIK_CERTIFICATESRESOLVERS_LE-DNS01-CLOUDFLARE_ACME_STORAGE=/letsencrypt/acme-le-dns01-cloudflare.json
      - TRAEFIK_CERTIFICATESRESOLVERS_LE-DNS01-CLOUDFLARE_ACME_DNSCHALLENGE_PROVIDER=cloudflare
      - TRAEFIK_CERTIFICATESRESOLVERS_LE-DNS01-CLOUDFLARE_ACME_DNSCHALLENGE_RESOLVERS=${PROXY_DNS_RESOLVERS:-127.0.0.11:53,1.1.1.1:53,1.0.0.1:53}
      - TRAEFIK_CERTIFICATESRESOLVERS_LE-DNS01-CLOUDFLARE_ACME_DNSCHALLENGE_PROPAGATION_DELAYBEFORECHECKS=${PROXY_DNS_PROPAGATION_DELAY:-0s}
      - TRAEFIK_CERTIFICATESRESOLVERS_LE-DNS01-CLOUDFLARE_ACME_DNSCHALLENGE_PROPAGATION_DISABLECHECKS=${PROXY_DNS_SKIP_CHECKS:-false}
      - CF_DNS_API_TOKEN=${PROXY_CLOUDFLARE_DNS_API_TOKEN-}
    # Settings that depend on what is enabled, written by deploy and
    # `devopsy proxies` (static_env in lib/common.sh): the entrypoints'
    # middlewares (proxies, tunnel), their forwarded-headers trust, the
    # proxies plugin and the default entrypoints.
    env_file:
      - path: ./mnt/traefik.env
        required: false
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 5s
      retries: 3
    # Hardening checklist, for every service here and the ones you add:
    # - a fixed non-root UID, from its first process: 10001, which every
    #   devopsy project's containers use, never the deploy user's (1000,
    #   in the docker group);
    # - a read-only root filesystem, with tmpfs or a mnt entry for what must
    #   be written;
    # - cap_drop ALL, adding back only a capability a stated reason needs
    #   (none here: Docker lets containers bind ports below 1024 without
    #   NET_BIND_SERVICE);
    # - no-new-privileges, so nothing gains privilege through setuid files;
    # - in images you build, no setuid binaries and no file capabilities
    #   the service does not need.
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    ports:
      - "${PROXY_HTTP_PORT-80}:80"
      - "${PROXY_HTTPS_PORT-443}:443"
      - "${PROXY_API_PORT-127.0.0.1:8080}:8080"
    volumes:
      - ./mnt/letsencrypt:/letsencrypt
      - ./mnt/dynamic:/dynamic:ro
      # Local Traefik plugins (Traefik reads ./plugins-local from /).
      - ./plugins-local:/plugins-local:ro
    networks:
      - default
      - dockerproxy
      - acmedns
      - tunnel

  # Optional acme-dns server for the le-dns01-selfhosted resolver: DNS-01 for any domain
  # after a one-time CNAME, without DNS provider tokens. Runs only with
  # COMPOSE_PROFILES=acmedns. Its API is only reachable from Traefik.
  # https://github.com/joohoi/acme-dns
  # Pinned exactly: it publishes no series tag. Its database (mnt/acmedns)
  # carries no devopsy.data label, so a rollback across a bump goes back to
  # the older image on data the newer one may have changed.
  acmedns:
    profiles: [acmedns]
    restart: unless-stopped
    image: joohoi/acme-dns:v2.0.2
    environment:
      - ACMEDNS_DOMAIN=${PROXY_ACMEDNS_DOMAIN-}
    labels:
      # devopsy gives mnt/acmedns to this UID, like mnt/letsencrypt above.
      # acme-dns creates its database with mode 600.
      - devopsy.mnt.owner=10001:10001
    # acme-dns only reads a config file: write it from the environment.
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        [ -n "$$ACMEDNS_DOMAIN" ] || { echo "Set PROXY_ACMEDNS_DOMAIN in .env" >&2; exit 1; }
        cat > /tmp/config.cfg <<EOF
        [general]
        listen = "0.0.0.0:53"
        protocol = "both4"
        domain = "$$ACMEDNS_DOMAIN"
        nsname = "ns-$$ACMEDNS_DOMAIN"
        nsadmin = "hostmaster.$$ACMEDNS_DOMAIN"
        records = ["$$ACMEDNS_DOMAIN. NS ns-$$ACMEDNS_DOMAIN."]
        debug = false
        [database]
        engine = "sqlite"
        connection = "/var/lib/acme-dns/acme-dns.db"
        [api]
        ip = "0.0.0.0"
        port = "80"
        tls = "none"
        disable_registration = false
        corsorigins = []
        use_header = false
        [logconfig]
        loglevel = "warn"
        logtype = "stdout"
        logformat = "text"
        EOF
        exec acme-dns -c /tmp/config.cfg
    healthcheck:
      test: ['CMD', 'wget', '-Y', 'off', '-q', '-O', '/dev/null', 'http://127.0.0.1/health']
      interval: 10s
      timeout: 5s
      retries: 3
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    # Bound to the public IP when set: binding 0.0.0.0:53 fails where
    # systemd-resolved holds 127.0.0.53:53, as on many cloud images.
    ports:
      - "${PROXY_ACMEDNS_IP:-0.0.0.0}:${PROXY_ACMEDNS_PORT-53}:53/udp"
      - "${PROXY_ACMEDNS_IP:-0.0.0.0}:${PROXY_ACMEDNS_PORT-53}:53/tcp"
    volumes:
      - ./mnt/acmedns:/var/lib/acme-dns
    networks:
      - acmedns

  # jq for commands and capabilities: `devopsy run --rm -T jq ...`. The
  # official image, nothing else in it; never started by `up`.
  jq:
    profiles: [tools]
    image: ghcr.io/jqlang/jq:1.8.1
    user: "10001:10001"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges

  # sqlite for `devopsy forget`: acme-dns's database has no other way to
  # remove a registration, and its image no sqlite. Python's, from the
  # official image, as the database's owner; never started by `up`.
  sqlite:
    profiles: [tools]
    image: python:3.14-alpine
    user: "10001:10001"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    volumes:
      - ./mnt/acmedns:/acmedns

  # curl for `devopsy domains`: DNS over HTTPS, certificates and requests as
  # visitors make them, from the server. Never started by `up`.
  curl:
    profiles: [tools]
    image: curlimages/curl:8.15.0
    user: "10001:10001"
    network_mode: bridge
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges

networks:
  # The network every routed container joins, as an external network.
  default:
    name: traefik
  dockerproxy:
    internal: true
  # Traefik and acme-dns only, so projects cannot reach the acme-dns API.
  acmedns: {}
  # Traefik and Cloudflare Tunnel connectors only (devopsy-template-cloudflared
  # joins it as external): requests from its subnet are the tunnel's.
  # Never the shared traefik network, where any project could claim to be
  # the tunnel.
  tunnel:
    name: tunnel
