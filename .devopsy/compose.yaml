name: traefik-${DEVOPSY_ENVIRONMENT-main}

services:
  # Read-only, filtered access to the Docker API for Traefik, so Traefik never
  # mounts the Docker socket itself.
  # https://github.com/wollomatic/socket-proxy
  dockerproxy:
    restart: unless-stopped
    image: wollomatic/socket-proxy:1.13.1
    command:
      - '-loglevel=info' # debug for far more logging
      - '-listenip=0.0.0.0'
      # Only the traefik container may connect.
      - '-allowfrom=traefik'
      # Read-only endpoints Traefik's Docker provider needs.
      - '-allowGET=/v1\..{1,2}/(version|containers/.*|events.*)'
      - '-allowHEAD=/_ping'
      - '-shutdowngracetime=5'
      # Exit if the socket goes away (Docker upgrade, for example) so the
      # restart policy brings it back with a fresh connection.
      - '-watchdoginterval=3600'
      - '-stoponwatchdog'
      - '-allowhealthcheck'
    healthcheck:
      test: ['CMD', './healthcheck']
      interval: 10s
      timeout: 5s
      retries: 2
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    # nobody, in the group that owns the Docker socket on the host
    # (`stat -c %g /var/run/docker.sock`). On macOS with OrbStack the socket
    # is always mounted as root, so the default of 0 works there.
    user: 65534:${DEVOPSY_DOCKER_GID-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dockerproxy

  traefik:
    restart: unless-stopped
    image: traefik:v3.7.13
    depends_on:
      dockerproxy:
        condition: service_healthy
    environment:
      # Dashboard and API on port 8080, published on localhost only (see
      # ports). Reach it with an SSH tunnel.
      - TRAEFIK_API_INSECURE=${TRAEFIK_API_INSECURE-true}
      - TRAEFIK_PING=true
      - TRAEFIK_ENTRYPOINTS_TRAEFIK_ADDRESS=:8080
      - TRAEFIK_ENTRYPOINTS_TRAEFIK_HTTP_ALIASHEADERSSTRATEGY=delete
      - TRAEFIK_LOG_LEVEL=${TRAEFIK_LOG_LEVEL-ERROR}

      # HTTP redirects everything to HTTPS.
      - TRAEFIK_ENTRYPOINTS_WEB=true
      - TRAEFIK_ENTRYPOINTS_WEB_ADDRESS=:80
      - TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_TO=websecure
      - TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_SCHEME=https
      - TRAEFIK_ENTRYPOINTS_WEB_HTTP_ALIASHEADERSSTRATEGY=delete
      - TRAEFIK_ENTRYPOINTS_WEBSECURE=true
      - TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS=:443
      - TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS=true
      # Default resolver for every router: letsencrypt1, or cloudflare (see
      # dns.env.example). A router can pick another with its own label.
      - TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_TLS_CERTRESOLVER=${DEVOPSY_CERTRESOLVER-letsencrypt1}
      # On every entrypoint, drop headers that alias others for PHP and
      # similar backends (X_Forwarded_For vs X-Forwarded-For), so clients
      # cannot spoof the headers Traefik sets.
      - TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_ALIASHEADERSSTRATEGY=delete

      # Containers opt in with traefik.enable=true and must join this network.
      - TRAEFIK_PROVIDERS_DOCKER=true
      - TRAEFIK_PROVIDERS_DOCKER_ENDPOINT=tcp://dockerproxy:2375
      - TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT=false
      - TRAEFIK_PROVIDERS_DOCKER_NETWORK=traefik-${DEVOPSY_ENVIRONMENT-main}

      # Let's Encrypt with the HTTP-01 challenge on port 80. It works with or
      # without a CDN proxy in front, and Traefik answers the challenge path
      # before the HTTPS redirect. Staging by default; set the CA server to
      # https://acme-v02.api.letsencrypt.org/directory for real certificates.
      # https://doc.traefik.io/traefik/https/acme/#httpchallenge
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT1=true
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT1_ACME_EMAIL=${TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT1_ACME_EMAIL:?A valid email is required for Let's Encrypt}
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT1_ACME_CASERVER=${TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT1_ACME_CASERVER-https://acme-staging-v02.api.letsencrypt.org/directory}
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT1_ACME_STORAGE=/letsencrypt/acme.json
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT1_ACME_HTTPCHALLENGE_ENTRYPOINT=web
    # Optional DNS-01 resolver through Cloudflare, only when dns.env exists.
    env_file:
      - path: ./dns.env
        required: false
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 5s
      retries: 3
    # Unprivileged. It owns mnt/letsencrypt, where acme.json lives.
    user: "${DEVOPSY_UID:?Set DEVOPSY_UID in .env (the uid that owns mnt/letsencrypt)}:${DEVOPSY_GID:?Set DEVOPSY_GID in .env (the gid that owns mnt/letsencrypt)}"
    ports:
      - "${DEVOPSY_HTTP_PORT-80}:80"
      - "${DEVOPSY_HTTPS_PORT-443}:443"
      - "${DEVOPSY_API_PORT-127.0.0.1:8080}:8080"
    volumes:
      - ./mnt/letsencrypt:/letsencrypt
    networks:
      - default
      - dockerproxy

networks:
  # The network every routed container joins, as an external network.
  default:
    name: traefik-${DEVOPSY_ENVIRONMENT-main}
  dockerproxy:
    internal: true
