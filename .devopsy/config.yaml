# devopsy config: see devopsy-cli's README, "Servers".
# One environment, prod, on every server: devopsy @<server>:prod, or an
# alias in the user-level ~/.config/devopsy/config.yaml (README, Setup).
project: traefik
secrets: [PROXY_CLOUDFLARE_DNS_API_TOKEN]
defaults:
  mode: image                    # only .devopsy/: nothing to build
  release:
    prepare: check               # refuses bad settings before the switch
    run: deploy
  rollback: deploy
environments:
  prod: {}
