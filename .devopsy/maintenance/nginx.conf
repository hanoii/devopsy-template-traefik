# The maintenance service's nginx (compose.yaml): every request gets the page
# as a 503 with Retry-After. Runs as 10001 on a read-only root: temporary
# files in /tmp (tmpfs).
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 256;
}

http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  default_type text/html;
  charset utf-8;

  server {
    listen 8080 default_server;
    root /;
    error_page 503 /index.html;

    location / {
      return 503;
    }

    # The server's own page (shared/mnt/maintenance/index.html), else ours.
    location = /index.html {
      internal;
      try_files /maintenance-custom/index.html /maintenance/index.html =404;
      add_header Retry-After 30 always;
      add_header Cache-Control no-store always;
    }
  }

  # Health check only.
  server {
    listen 127.0.0.1:8081;
    location / {
      return 204;
    }
  }
}
