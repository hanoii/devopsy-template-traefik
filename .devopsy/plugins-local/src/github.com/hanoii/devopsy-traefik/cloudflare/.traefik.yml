displayName: devopsy Cloudflare real client IP
type: middleware
import: github.com/hanoii/devopsy-traefik/cloudflare
summary: >-
  Behind Cloudflare's proxy, makes the visitor's IP (CF-Connecting-IP) the
  request's client IP, so X-Forwarded-For and X-Real-Ip carry it. Requests
  from anywhere else lose any CF-Connecting-IP header.
testData:
  trustedIPs:
    - 173.245.48.0/20
